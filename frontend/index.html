<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint Codex</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 0 auto;
            padding: 16px;
            background-color: #f3ead3;
            color: #3f3426;
        }

        details {
            border: 1px solid #b9a27a;
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 8px;
            background-color: #fff8e8;
        }

        summary {
            font-weight: bold;
            color: #5f4a2f;
        }
    
        form {
            margin-bottom: 24px;
        }

        input,
        select,
        button {
            font-size: 16px;
            padding: 8px;
            margin: 4px 0;
        }
    
        input,
        select {
            width: 100%;
            box-sizing: border-box;
            background-color: #fffaf0;
            border: 1px solid #b9a27a;
            color: #3f3426;
            border-radius: 4px;
        }

        button {
            background-color: #d8c29d;
            border: 1px solid #a88d63;
            color: #3f3426;
            border-radius: 4px;
        }

        .message {
            font-weight: bold;
            margin: 12px 0;
        }

        .delete-button {
            font-size: 14px;
            padding: 2px 6px;
            margin-left: 8px;
            background-color: #e3cfaa;
        }
    </style>
</head>

<body>
    <h1>Paint Codex</h1>
    <!-- Zone pour affichage des figurines et etapes de peinture -->
    <div id="figurines"></div>
    <!-- Zone d'identification nécessaire pour les opérations d'écriture -->
    <div>
        <label for="username">Utilisateur :</label>
        <input type="text" id="username">
    
        <label for="password">Mot de passe :</label>
        <input type="password" id="password">
    </div>
    <!-- Zone pour afficher les messages erreurs -->
    <p id="message" class="message"></p>
    <!-- Formulaire pour ajouter de figurine -->
    <form id="ajouterFig">
        <label for="nomFig">Figurine :</label>
        <input type="text" id="nomFig" required>
        <button>Ajouter</button>
    </form>
    <!-- Formulaire pour ajout de step -->
    <form id="ajouterStep">
        <p>Step :</p>
        <label for="figurineStep">Figurine :</label>
        <select id="figurineStep" required>
        </select>
        
        <label for="descriptionStep">Description :</label>
        <input type="text" id="descriptionStep" required>

        <label for="outilStep">Outil :</label>
        <select id="outilStep" required>
            <option value="pinceau">Pinceau</option>
            <option value="bombe">Bombe</option>
            <option value="aerographe">Aérographe</option>
            <option value="autre">Autre</option>
        </select>

        <label for="ordreStep">Ordre :</label>
        <input type="number" id="ordreStep" required>

        <button>Ajouter</button>
    </form>
    <script>
        /*
        Construit le header Basic Auth à partir des identifiants saisis
        */
        function getAuthorizationHeader() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const credentials = btoa(username + ":" + password);

            return "Basic " + credentials;
        }

        /*
        Charge les figurines et les étapes depuis l'API REST pour construire l'affichage
        */
        function chargerDonnees() {
            Promise.all([
                fetch("https://paint-codex.onrender.com/figurines/").then(function(response) {
                    return response.json();
                }),
                fetch("https://paint-codex.onrender.com/steps/").then(function(response) {
                    return response.json();
                })
            ])
            .then(function(resultats) {
                const figurines = resultats[0];
                const steps = resultats[1];

                const listeFigurines = document.createElement("ul");


                const select = document.getElementById("figurineStep");
                select.innerHTML = "";

                for(const figurine of figurines) {

                    // Pour remplir le select de nom de figurine nécessaire à l'ajout d'un step
                    const option = document.createElement("option");
                    option.value = figurine.id;
                    option.textContent = figurine.nom;

                    select.appendChild(option);

                    const detailsFigurine = document.createElement("details");
                    const summaryFigurine = document.createElement("summary");
                    summaryFigurine.textContent = figurine.nom;
                    detailsFigurine.appendChild(summaryFigurine);

                    // Bouton qui permettra de supprimer une figurine
                    const itemDeleteFig = document.createElement("button");
                    itemDeleteFig.textContent = "x";
                    itemDeleteFig.classList.add("delete-button");

                    itemDeleteFig.addEventListener("click", function () {

                        // Demander confirmation avant de réellement executer
                        const confirme = confirm(
                            "Supprimer \"" + figurine.nom + "\" et toutes ses étapes ?"
                        );
                        if (!confirme) {
                            return;
                        }

                        // Appel au DELETE via API REST
                        fetch("https://paint-codex.onrender.com/figurines/" + figurine.id + "/", {
                            method: "DELETE",
                            headers: {
                                "Authorization": getAuthorizationHeader()
                            }
                        })
                        .then(function (response) {
                            if (!response.ok) {
                                throw new Error("Erreur lors de la suppression");
                            }

                            // Si tout se passe bien on recharge les données, sinon on lève une exception
                            document.getElementById("message").textContent = "";
                            chargerDonnees();
                        })
                        .catch(function(error) {
                            const message = document.getElementById("message");
                            message.textContent = error.message;
                        });
                    });

                    summaryFigurine.appendChild(itemDeleteFig);
                    listeFigurines.appendChild(detailsFigurine);
                
                    const listeSteps = document.createElement("ul");
                    detailsFigurine.appendChild(listeSteps);

                    for (const step of steps) {
                        if (step.figurine === figurine.id) {
                            const itemStep = document.createElement("li");
                            itemStep.textContent = "#" + step.ordre + " " + step.description + " / " + step.outil;

                            const itemDeleteStep = document.createElement("button");
                            itemDeleteStep.textContent = "x";
                            itemDeleteStep.classList.add("delete-button");

                            itemDeleteStep.addEventListener("click", function () {

                                // Demander confirmation avant de réellement executer
                                const confirme = confirm(
                                    "Supprimer l'étape n°" + step.ordre + " : \"" + step.description + "\" ?"
                                );
                                if (!confirme) {
                                    return;
                                }

                                // Appel au DELETE via API REST
                                fetch("https://paint-codex.onrender.com/steps/" + step.id + "/", {
                                    method: "DELETE",
                                    headers: {
                                        "Authorization": getAuthorizationHeader()
                                    }
                                })
                                .then(function (response) {
                                    if (!response.ok) {
                                        throw new Error("Erreur lors de la suppression");
                                    }

                                    // Si tout se passe bien on recharge les données, sinon on lève une exception
                                    document.getElementById("message").textContent = "";
                                    chargerDonnees();
                                })
                                .catch(function (error) {
                                    const message = document.getElementById("message");
                                    message.textContent = error.message;
                                });
                            });

                            itemStep.appendChild(itemDeleteStep);
                            listeSteps.appendChild(itemStep);
                        }
                    }

                }

                const element = document.getElementById("figurines");
                element.innerHTML = "";
                element.appendChild(listeFigurines);
            });
        }
        chargerDonnees();

        const formFig = document.getElementById("ajouterFig");

        formFig.addEventListener("submit", function (event) {
            event.preventDefault();

            // Récupération du nom de la figurine et création du JSON
            const nom = document.getElementById("nomFig").value;

            const nouvelleFigurine = {
                nom: nom
            };

            // Appel au POST via API REST
            fetch("https://paint-codex.onrender.com/figurines/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": getAuthorizationHeader()
                },
                body: JSON.stringify(nouvelleFigurine)
            })
            .then(function(response) {
                if (!response.ok) {
                    throw new Error("Erreur lors de la création");
                }
                
                return response.json();
            })
            .then(function() {
                // Si tout se passe bien on efface le message d'erreur et on recharge les données, sinon on lève une exception
                document.getElementById("message").textContent = "";
                chargerDonnees();
            })
            .catch(function(error) {
                const message = document.getElementById("message");
                message.textContent = error.message;
            });
        });

        const formStep = document.getElementById("ajouterStep");

        formStep.addEventListener("submit", function (event) {
            event.preventDefault();

            // Récupération des informations de la step et création du JSON
            const figurineId = Number(document.getElementById("figurineStep").value);
            const description = document.getElementById("descriptionStep").value;
            const outil = document.getElementById("outilStep").value;
            const ordre = Number(document.getElementById("ordreStep").value);

            const nouvelleStep = {
                figurine: figurineId,
                description: description,
                outil: outil,
                ordre: ordre
            };

            // Appel au POST via API REST
            fetch("https://paint-codex.onrender.com/steps/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": getAuthorizationHeader()
                },
                body: JSON.stringify(nouvelleStep)
            })
            .then(function(response) {
                if (!response.ok) {
                    throw new Error("Erreur lors de la création");
                }

                return response.json();
            })
            .then(function() {
                // Si tout se passe bien on efface le message d'erreur et on recharge les données, sinon on lève une exception
                document.getElementById("message").textContent = "";
                chargerDonnees();
            })
            .catch(function(error) {
                const message = document.getElementById("message");
                message.textContent = error.message;
            });
        });

        
    </script>
</body>

</html>
