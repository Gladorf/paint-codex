<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Paint Codex</title>
</head>

<body>
    <h1>Paint Codex</h1>
    <pre id="figurines">
    {
        le JSON apparaitra ici
    }
    </pre>
    <script>
        Promise.all([
            fetch("http://127.0.0.1:8000/figurines/").then(function(response) {
                return response.json();
            }),
            fetch("http://127.0.0.1:8000/steps/").then(function(response) {
                return response.json();
            })
        ])
        .then(function(resultats) {
            const figurines = resultats[0];
            const steps = resultats[1];

            let html = "";
            html += "<ul>";

            for(const figurine of figurines) {
                html += "<li>";
                html += figurine.nom;
                
                html += "<ul>";
                for(const step of steps) {
                    if(step.figurine === figurine.id) {
                        html += "<li>";
                        html += "#" + step.ordre + " " + step.description + " / " + step.outil;
                        html += "</li>";
                    }
                }
                html += "</ul>";

                html += "</li>";
            }

            html += "</ul>";

            const element = document.getElementById("figurines");
            element.innerHTML = html;
        });
    </script>
</body>

</html>
